name: Cucumber Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cucumber:
    name: cucumber
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Cucumber Tests
        run: mvn clean test